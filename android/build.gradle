ext.kotlin_version = '2.2.20'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Some older Flutter plugin packages (e.g. connectivity_plus 3.0.6) predate
// AGP 8's mandatory `namespace` and only declare a manifest `package` attribute.
// Backfill it from their AndroidManifest.xml so the build doesn't fail.
// Must be registered before evaluationDependsOn below forces early evaluation.
subprojects {
    afterEvaluate { project ->
        def androidExt = project.extensions.findByName('android')
        if (androidExt != null && androidExt.hasProperty('namespace') && androidExt.namespace == null) {
            def manifestFile = project.file('src/main/AndroidManifest.xml')
            if (manifestFile.exists()) {
                def manifestPackage = new XmlSlurper().parse(manifestFile).@package.text()
                if (manifestPackage) {
                    androidExt.namespace = manifestPackage
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
